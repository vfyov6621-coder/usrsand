<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sandusr — Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --bg3: #1a1a2e;
            --border: #2a2a3e;
            --text: #e0e0e0;
            --text2: #8888aa;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #fff;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header h1 span { color: var(--accent2); }
        .status-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 500;
        }
        .status-badge.online { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-badge.offline { background: rgba(239,68,68,0.15); color: var(--red); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .online .status-dot { background: var(--green); }
        .offline .status-dot { background: var(--red); animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Layout ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full { grid-column: 1 / -1; }

        /* ── Cards ── */
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }
        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-header h2 { font-size: 14px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
        .card-body { padding: 16px 18px; }

        /* ── Stats ── */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .stat {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-value.green { color: var(--green); }
        .stat-value.purple { color: var(--accent2); }
        .stat-value.blue { color: var(--blue); }
        .stat-value.yellow { color: var(--yellow); }

        /* ── Scripts ── */
        .script-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .script-item:last-child { border-bottom: none; }
        .script-info { display: flex; align-items: center; gap: 12px; }
        .script-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .script-name { font-weight: 600; font-size: 14px; }
        .script-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
        .script-meta { text-align: right; }
        .script-cmd {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 13px; color: var(--accent2);
            background: rgba(168,85,247,0.1);
            padding: 3px 10px; border-radius: 6px;
        }
        .script-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
        }
        .tag-loaded { background: rgba(34,197,94,0.15); color: var(--green); }
        .tag-lines { background: rgba(59,130,246,0.15); color: var(--blue); }
        .tag-addon { background: rgba(234,179,8,0.15); color: var(--yellow); }

        /* ── Logs ── */
        .log-container {
            height: 340px;
            overflow-y: auto;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.7;
        }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: var(--bg); }
        .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .log-line { display: flex; gap: 10px; padding: 2px 0; }
        .log-time { color: var(--text2); min-width: 70px; }
        .log-level { min-width: 50px; font-weight: 600; }
        .log-level.INFO { color: var(--blue); }
        .log-level.WARNING { color: var(--yellow); }
        .log-level.ERROR { color: var(--red); }
        .log-msg { color: var(--text); }

        /* ── Commands ── */
        .cmd-row {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .cmd-row:last-child { border-bottom: none; }
        .cmd-name {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 13px; color: var(--accent2);
            background: rgba(168,85,247,0.1);
            padding: 4px 12px; border-radius: 6px;
            min-width: 200px;
            white-space: nowrap;
        }
        .cmd-desc { font-size: 13px; color: var(--text2); }

        /* ── Account ── */
        .account-card {
            display: flex; align-items: center; gap: 16px;
            padding: 20px;
        }
        .account-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .account-name { font-size: 18px; font-weight: 600; }
        .account-detail { font-size: 13px; color: var(--text2); margin-top: 3px; }
        .uptime-bar {
            margin-top: 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .uptime-label { font-size: 12px; color: var(--text2); }
        .uptime-value { font-family: monospace; font-size: 14px; color: var(--green); font-weight: 600; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .cmd-name { min-width: 140px; }
            .container { padding: 14px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo">S</div>
        <h1>sand<span>usr</span></h1>
    </div>
    <div id="statusBadge" class="status-badge offline">
        <div class="status-dot"></div>
        <span id="statusText">Offline</span>
    </div>
</div>

<div class="container">
    <!-- Stats -->
    <div class="stats-grid" style="margin-bottom: 20px;">
        <div class="stat">
            <div class="stat-label">Статус</div>
            <div class="stat-value green" id="statStatus">---</div>
        </div>
        <div class="stat">
            <div class="stat-label">Модули</div>
            <div class="stat-value purple" id="statModules">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Аптайм</div>
            <div class="stat-value blue" id="statUptime">---</div>
        </div>
        <div class="stat">
            <div class="stat-label">Версия</div>
            <div class="stat-value yellow" id="statVersion">3.0</div>
        </div>
    </div>

    <div class="grid">
        <!-- Account -->
        <div class="card">
            <div class="card-header">
                <h2>Аккаунт</h2>
            </div>
            <div class="card-body">
                <div class="account-card">
                    <div class="account-avatar">&#129302;</div>
                    <div>
                        <div class="account-name" id="accountName">---</div>
                        <div class="account-detail" id="accountDetail">Ожидание подключения...</div>
                    </div>
                </div>
                <div class="uptime-bar">
                    <span class="uptime-label">Аптайм:</span>
                    <span class="uptime-value" id="uptimeValue">---</span>
                </div>
            </div>
        </div>

        <!-- Logs -->
        <div class="card">
            <div class="card-header">
                <h2>Логи</h2>
                <span style="font-size: 12px; color: var(--text2);" id="logCount">0 записей</span>
            </div>
            <div class="card-body" style="padding: 0;">
                <div class="log-container" id="logContainer">
                    <div style="padding: 18px; color: var(--text2); text-align: center;">Загрузка...</div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <div class="card full">
            <div class="card-header">
                <h2>Модули</h2>
                <span style="font-size: 12px; color: var(--text2);" id="scriptsCount">0 загружено</span>
            </div>
            <div class="card-body" id="scriptsList">
                <div style="color: var(--text2); text-align: center;">Загрузка...</div>
            </div>
        </div>

        <!-- Commands -->
        <div class="card full">
            <div class="card-header">
                <h2>Команды</h2>
            </div>
            <div class="card-body" id="commandsList">
                <div style="color: var(--text2); text-align: center;">Загрузка...</div>
            </div>
        </div>
    </div>
</div>

<script>
const SCRIPT_ICONS = {
    ping: "&#127891;",
    notes: "&#128221;",
    weather: "&#127780;",
    translator: "&#127760;",
    ai_chat: "&#129302;",
};

function fmtUptime(s) {
    if (!s) return "---";
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    let parts = [];
    if (d > 0) parts.push(d + "д");
    if (h > 0) parts.push(h + "ч");
    parts.push(m + "м");
    return parts.join(" ");
}

async function fetchStatus() {
    try {
        const r = await fetch("/api/status");
        const d = await r.json();

        const badge = document.getElementById("statusBadge");
        const statStatus = document.getElementById("statStatus");
        if (d.status === "online") {
            badge.className = "status-badge online";
            document.getElementById("statusText").textContent = "Online";
            statStatus.textContent = "Online";
            statStatus.className = "stat-value green";
        } else {
            badge.className = "status-badge offline";
            document.getElementById("statusText").textContent = "Offline";
            statStatus.textContent = "Offline";
            statStatus.className = "stat-value";
        }

        document.getElementById("statModules").textContent = d.scripts_count;
        document.getElementById("statUptime").textContent = fmtUptime(d.uptime);
        document.getElementById("uptimeValue").textContent = fmtUptime(d.uptime);

        if (d.account) {
            document.getElementById("accountName").textContent = d.account;
            document.getElementById("accountDetail").textContent = "Telegram Userbot";
        }

    } catch (e) { console.error(e); }
}

async function fetchLogs() {
    try {
        const r = await fetch("/api/logs");
        const logs = await r.json();
        const container = document.getElementById("logContainer");
        document.getElementById("logCount").textContent = logs.length + " записей";

        if (logs.length === 0) {
            container.innerHTML = '<div style="padding: 18px; color: var(--text2); text-align: center;">Нет логов</div>';
            return;
        }

        let html = "";
        for (const log of logs) {
            html += `<div class="log-line">
                <span class="log-time">${log.time}</span>
                <span class="log-level ${log.level}">${log.level}</span>
                <span class="log-msg">${escHtml(log.message)}</span>
            </div>`;
        }
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    } catch (e) { console.error(e); }
}

async function fetchScripts() {
    try {
        const r = await fetch("/api/scripts");
        const scripts = await r.json();
        const container = document.getElementById("scriptsList");
        const loaded = scripts.filter(s => s.loaded).length;
        document.getElementById("scriptsCount").textContent = loaded + " / " + scripts.length + " загружено";

        if (scripts.length === 0) {
            container.innerHTML = '<div style="color: var(--text2); text-align: center;">Нет модулей</div>';
            return;
        }

        let html = "";
        for (const s of scripts) {
            const icon = SCRIPT_ICONS[s.id] || "&#128196;";
            const statusTag = s.loaded
                ? '<span class="script-tag tag-loaded">Активен</span>'
                : '<span class="script-tag" style="background:rgba(239,68,68,0.15);color:var(--red)">Не загружен</span>';
            const addonTags = s.addons.length > 0
                ? ` <span class="script-tag tag-addon">${s.addons.length} аддонов</span>`
                : "";

            html += `<div class="script-item">
                <div class="script-info">
                    <div class="script-icon">${icon}</div>
                    <div>
                        <div class="script-name">${escHtml(s.name)}</div>
                        <div class="script-desc">${escHtml(s.description)}</div>
                    </div>
                </div>
                <div class="script-meta">
                    <div class="script-cmd">${escHtml(s.command)}</div>
                    <div style="margin-top: 4px;">${statusTag} <span class="script-tag tag-lines">${s.lines} строк</span>${addonTags}</div>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    } catch (e) { console.error(e); }
}

async function fetchCommands() {
    try {
        const r = await fetch("/api/commands");
        const cmds = await r.json();
        const container = document.getElementById("commandsList");

        let html = "";
        for (const c of cmds) {
            html += `<div class="cmd-row">
                <div class="cmd-name">${escHtml(c.cmd)}</div>
                <div class="cmd-desc">${escHtml(c.desc)}</div>
            </div>`;
        }
        container.innerHTML = html;
    } catch (e) { console.error(e); }
}

function escHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
}

// Initial load
fetchStatus();
fetchLogs();
fetchScripts();
fetchCommands();

// Auto-refresh
setInterval(fetchStatus, 5000);
setInterval(fetchLogs, 3000);
</script>

</body>
</html>
